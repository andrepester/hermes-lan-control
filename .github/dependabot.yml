version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CodeQL init and analyze must run the same action version.
      codeql:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tests/harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
